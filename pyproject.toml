[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-jobs-py"
version = "0.1.0"
description = "SolidJobs for Python: Redis task runner on PEP 734 subinterpreters, backed by the Ruby solid-redis gem through a sidecar."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
solid-jobs = "solid_jobs.console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solid_jobs = ["*.rb"]
