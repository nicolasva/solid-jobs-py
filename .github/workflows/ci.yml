name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.14"]
        ruby: ["3.3", "3.4"]
    env:
      REDIS_URL: redis://127.0.0.1:6390/15
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Redis (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Install Redis (macOS)
        if: runner.os == 'macOS'
        run: brew install redis

      - name: Start Redis
        run: |
          redis-server --port 6390 --save "" --appendonly no --daemonize yes
          for _ in $(seq 1 30); do redis-cli -p 6390 ping && break; sleep 0.5; done

      - name: Run tests
        run: bundle exec python -m unittest discover -s tests -t . -v

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Wheel embeds the Ruby gateway
        run: python -m zipfile -l dist/*.whl | grep solid_redis_gateway.rb

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
